<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聚餐分帳器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}.wrap{max-width:560px;margin:auto;padding:24px 16px 40px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 18px #0000000d}h1{font-size:28px;margin:0 0 8px}p{color:#666;margin:0 0 20px}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:8px}.input{width:100%;padding:14px;border:1px solid #d8dbe2;border-radius:10px;font-size:18px}.check{display:flex;align-items:center;gap:10px;font-size:17px}.check input{width:20px;height:20px}.btn{width:100%;border:0;border-radius:11px;padding:14px;font-size:18px;font-weight:700;background:#222;color:#fff;cursor:pointer;margin-top:8px}.result{margin-top:20px;padding-top:20px;border-top:1px solid #eee}.total{text-align:center;font-size:16px;color:#666}.total strong{display:block;font-size:32px;color:#222;margin-top:4px}.people{margin-top:14px}.person{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid #eee;font-size:18px}.person strong{font-size:22px}.payer{background:#f0f1f4;border-radius:10px;padding:12px 10px;margin-top:10px}.note{font-size:14px;color:#666;margin-top:14px;line-height:1.6}.error{color:#b00020;font-weight:700;margin-top:10px}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>🍽️ 聚餐分帳器</h1><p>離線使用，不連網、不登入、不儲存任何人的資料。</p>
<div class="field"><label for="amount">總金額</label><input class="input" id="amount" type="number" min="0" step="1" placeholder="例如 1000"></div>
<div class="field"><label for="count">用餐人數</label><input class="input" id="count" type="number" min="1" step="1" value="3"></div>
<div class="field"><label class="check"><input id="service" type="checkbox"> 加 10% 服務費</label></div>
<button class="btn" id="calc">開始分帳</button><div id="error" class="error hidden"></div>
<div id="result" class="result hidden"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
function money(n){return Math.round(n).toLocaleString('zh-TW')+' 元'}
function calc(){
 const raw=Number($('amount').value), count=Number($('count').value), service=$('service').checked;
 $('error').classList.add('hidden'); $('result').classList.add('hidden');
 if(!Number.isFinite(raw)||raw<0||!Number.isInteger(raw)){return showError('請輸入 0 以上的整數總金額。')}
 if(!Number.isInteger(count)||count<1){return showError('用餐人數至少要 1 人。')}
 // 以整數元計算，10% 服務費若出現小數，一律四捨五入到整數元，確保最後總和仍精確。
 const serviceFee=service?Math.round(raw*0.10):0;
 const total=raw+serviceFee;
 const each=Math.floor(total/count);
 const remainder=total-each*count;
 const names=[];
 for(let i=0;i<count;i++) names.push(i===0?'付錢的人':'第 '+(i+1)+' 人');
 let html='<div class="total">含服務費後總金額<strong>'+money(total)+'</strong></div><div class="people">';
 for(let i=0;i<count;i++){
   const pay=each+(i===0?remainder:0);
   html+='<div class="person '+(i===0?'payer':'')+'"><span>'+names[i]+(i===0?'（負責付錢）':'')+'</span><strong>'+money(pay)+'</strong></div>';
 }
 html+='</div>';
 if(serviceFee) html+='<div class="note">10% 服務費：'+money(serviceFee)+'。已加入總金額。</div>';
 if(remainder>0) html+='<div class="note">零頭 '+money(remainder)+' 已算在付錢的人身上，因此大家的金額加總會剛好等於 '+money(total)+'。</div>';
 else html+='<div class="note">剛好除盡，沒有零頭。</div>';
 $('result').innerHTML=html; $('result').classList.remove('hidden');
}
function showError(t){$('error').textContent=t;$('error').classList.remove('hidden')}
$('calc').addEventListener('click',calc);
['amount','count'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')calc()}));
</script></body></html>
